<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>P-Fidelizar: Quick Launch Brag</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { background-color: #04060a; color: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; margin: 0; padding: 0; }
  </style>
</head>
<body class="w-[1920px] h-[1080px] flex items-center justify-center relative select-none">
  <main id="stage" data-composition-id="fidelizar_brag" data-start="0" data-duration="6" data-fps="30" data-width="1920" data-height="1080" class="w-full h-full flex items-center justify-center relative">
    
    <!-- Aura de fondo -->
    <div class="absolute w-[800px] h-[800px] bg-[#00A2C7]/15 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- Escena 1: Hook (0s a 2s) -->
    <div id="scene1" class="absolute flex flex-col items-center text-center opacity-0 scale-90">
      <div class="px-5 py-1.5 rounded-full border border-[#00A2C7]/40 bg-[#00A2C7]/10 text-[#00A2C7] text-xl font-bold tracking-widest uppercase mb-6">
        El Desafío Comercial
      </div>
      <h1 class="text-7xl font-black tracking-tight max-w-4xl leading-tight">
        ¿Tus clientes compran una vez <br><span class="text-neutral-500">y no vuelven más?</span>
      </h1>
    </div>

    <!-- Escena 2: Solución Fidelizar (2s a 4.2s) -->
    <div id="scene2" class="absolute flex flex-col items-center text-center opacity-0 translate-y-8">
      <div class="px-6 py-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-lg font-bold tracking-wide mb-8">
        La Solución: P-Fidelizar
      </div>
      <div class="bg-white/5 border border-white/10 p-10 rounded-3xl backdrop-blur-xl flex items-center gap-10 shadow-2xl">
        <div class="w-24 h-24 rounded-2xl bg-[#00A2C7] flex items-center justify-center text-white text-4xl font-black shadow-lg shadow-[#00A2C7]/30">
          QR
        </div>
        <div class="text-left">
          <div class="text-neutral-400 text-base font-semibold">Escaneo en Caja</div>
          <div class="text-5xl font-black text-white mt-1">+250 Puntos</div>
          <div class="text-emerald-400 text-base font-bold mt-2">✓ Cliente recurrente verificado</div>
        </div>
      </div>
    </div>

    <!-- Escena 3: Cierre y Marca (4.2s a 6s) -->
    <div id="scene3" class="absolute flex flex-col items-center text-center opacity-0 scale-95">
      <h2 class="text-7xl font-black tracking-tight mb-4 text-white">
        Automatizá la lealtad de tu negocio.
      </h2>
      <p class="text-neutral-400 text-2xl mb-8 font-medium">Recompensas instantáneas. Métricas en vivo. Cero fricción.</p>
      <div class="bg-[#00A2C7] text-white px-12 py-5 rounded-full text-2xl font-black tracking-wider shadow-xl shadow-[#00A2C7]/40">
        p-fidelizar.com
      </div>
    </div>

  </main>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Registro estricto del runtime de HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["fidelizar_brag"] = tl;

    // Escena 1: 0s a 2.0s
    tl.to("#scene1", { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.1)
      .to("#scene1", { opacity: 0, scale: 1.05, duration: 0.35, ease: "power2.in" }, 1.7);

    // Escena 2: 2.0s a 4.2s
    tl.to("#scene2", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 2.0)
      .to("#scene2", { scale: 1.04, duration: 1.2, ease: "none" }, 2.5)
      .to("#scene2", { opacity: 0, scale: 0.95, duration: 0.35, ease: "power2.in" }, 3.9);

    // Escena 3: 4.2s a 6.0s
    tl.to("#scene3", { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 4.3)
      .to("#scene3", { y: -8, duration: 1.2, ease: "none" }, 4.8);

    // Protocolo de renderizado determinístico de HyperFrames
    window.renderFrame = function(timeInSeconds) {
      tl.seek(timeInSeconds);
    };

    // Auto reproducción local
    tl.play();
  </script>
</body>
</html>
